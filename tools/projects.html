<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spain Projects — ClearSky</title>
<link rel="icon" href="/assets/favicon.png">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --navy: #0A1628;
  --navy-light: #122140;
  --navy-mid: #1a3058;
  --gold: #C8A951;
  --gold-dim: #9e8540;
  --gold-bg: rgba(200,169,81,0.08);
  --white: #F5F5F0;
  --text: #E8E4DC;
  --text-dim: #8A8678;
  --green: #4ADE80;
  --green-bg: rgba(74,222,128,0.12);
  --red: #F87171;
  --red-bg: rgba(248,113,113,0.12);
  --amber: #FBBF24;
  --amber-bg: rgba(251,191,36,0.12);
  --blue: #60A5FA;
  --radius: 10px;
  --shadow: 0 2px 12px rgba(0,0,0,0.3);
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'DM Sans',sans-serif; background:var(--navy); color:var(--text); min-height:100vh; }
a { color:var(--gold); text-decoration:none; }

/* ── NAV ── */
.nav { display:flex; align-items:center; justify-content:space-between; padding:16px 32px; border-bottom:1px solid rgba(200,169,81,0.15); background:var(--navy); position:sticky; top:0; z-index:100; }
.nav-brand { display:flex; align-items:center; gap:12px; }
.nav-brand img { height:28px; }
.nav-brand span { font-size:13px; color:var(--text-dim); letter-spacing:1.5px; text-transform:uppercase; font-weight:500; }
.nav-actions { display:flex; gap:10px; }
.btn { padding:8px 18px; border-radius:6px; border:none; cursor:pointer; font-family:inherit; font-size:13px; font-weight:600; transition:all 0.15s; }
.btn-gold { background:var(--gold); color:var(--navy); }
.btn-gold:hover { background:#d4b55e; }
.btn-outline { background:transparent; color:var(--gold); border:1px solid var(--gold-dim); }
.btn-outline:hover { background:var(--gold-bg); }
.btn-sm { padding:5px 12px; font-size:12px; }
.btn-icon { width:34px; height:34px; padding:0; display:flex; align-items:center; justify-content:center; border-radius:6px; background:var(--navy-light); border:1px solid rgba(200,169,81,0.15); color:var(--text-dim); cursor:pointer; transition:all 0.15s; }
.btn-icon:hover { color:var(--gold); border-color:var(--gold); }

/* ── SUMMARY BAR ── */
.summary { display:grid; grid-template-columns:repeat(6,1fr); gap:12px; padding:20px 32px; border-bottom:1px solid rgba(200,169,81,0.08); }
.stat { background:var(--navy-light); border:1px solid rgba(200,169,81,0.1); border-radius:var(--radius); padding:14px 16px; }
.stat-label { font-size:11px; color:var(--text-dim); text-transform:uppercase; letter-spacing:1px; margin-bottom:4px; }
.stat-value { font-size:22px; font-weight:700; color:var(--white); font-family:'JetBrains Mono',monospace; }
.stat-sub { font-size:11px; color:var(--text-dim); margin-top:2px; }
.stat-value.positive { color:var(--green); }
.stat-value.negative { color:var(--red); }
.stat-value.gold { color:var(--gold); }

/* ── VIEW TOGGLE + CONTROLS ── */
.controls { display:flex; align-items:center; justify-content:space-between; padding:16px 32px; }
.view-tabs { display:flex; gap:2px; background:var(--navy-light); border-radius:8px; padding:3px; }
.view-tab { padding:7px 16px; border-radius:6px; border:none; background:transparent; color:var(--text-dim); font-family:inherit; font-size:13px; font-weight:500; cursor:pointer; transition:all 0.15s; }
.view-tab.active { background:var(--gold); color:var(--navy); }
.controls-right { display:flex; gap:10px; align-items:center; }
.search-box { background:var(--navy-light); border:1px solid rgba(200,169,81,0.15); border-radius:6px; padding:7px 12px; color:var(--text); font-family:inherit; font-size:13px; width:220px; outline:none; }
.search-box:focus { border-color:var(--gold); }
.search-box::placeholder { color:var(--text-dim); }

/* ── TABLE VIEW ── */
.table-wrap { padding:0 32px 32px; overflow-x:auto; }
table { width:100%; border-collapse:collapse; }
thead th { background:var(--navy-light); padding:10px 14px; text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:1px; color:var(--text-dim); font-weight:600; border-bottom:2px solid var(--gold-dim); white-space:nowrap; position:sticky; top:0; }
tbody tr { border-bottom:1px solid rgba(200,169,81,0.06); cursor:pointer; transition:background 0.1s; }
tbody tr:hover { background:rgba(200,169,81,0.04); }
tbody tr.total-row { background:var(--gold-bg); border-top:2px solid var(--gold-dim); cursor:default; }
tbody tr.total-row td { font-weight:700; color:var(--gold); }
tbody td { padding:10px 14px; font-size:13px; white-space:nowrap; }
.mono { font-family:'JetBrains Mono',monospace; font-size:12px; }
.cell-right { text-align:right; }

/* ── STATUS BADGES ── */
.badge { display:inline-block; padding:3px 10px; border-radius:20px; font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:0.5px; }
.badge-contracted { background:var(--green-bg); color:var(--green); }
.badge-contract_sent { background:rgba(96,165,250,0.15); color:var(--blue); }
.badge-contract_negotiation { background:rgba(96,165,250,0.15); color:var(--blue); }
.badge-due_diligence { background:var(--amber-bg); color:var(--amber); }
.badge-prospecting { background:rgba(200,169,81,0.12); color:var(--gold); }
.badge-preparation { background:rgba(200,169,81,0.08); color:var(--text-dim); }
.badge-engineering { background:rgba(74,222,128,0.08); color:var(--green); }
.badge-miteco_filing { background:rgba(74,222,128,0.12); color:var(--green); }
.badge-registered { background:var(--green); color:var(--navy); }
.badge-paused { background:rgba(248,113,113,0.1); color:var(--red); }

/* ── KANBAN VIEW ── */
.kanban { display:flex; gap:14px; padding:0 32px 32px; overflow-x:auto; min-height:60vh; }
.kanban-col { min-width:260px; flex:1; background:var(--navy-light); border-radius:var(--radius); border:1px solid rgba(200,169,81,0.08); display:flex; flex-direction:column; }
.kanban-header { padding:12px 14px; border-bottom:1px solid rgba(200,169,81,0.1); display:flex; align-items:center; justify-content:space-between; }
.kanban-header h3 { font-size:12px; text-transform:uppercase; letter-spacing:1px; color:var(--text-dim); font-weight:600; }
.kanban-count { background:var(--navy); padding:2px 8px; border-radius:10px; font-size:11px; color:var(--text-dim); font-family:'JetBrains Mono',monospace; }
.kanban-cards { padding:10px; flex:1; display:flex; flex-direction:column; gap:8px; overflow-y:auto; }
.card { background:var(--navy); border:1px solid rgba(200,169,81,0.1); border-radius:8px; padding:14px; cursor:pointer; transition:all 0.15s; }
.card:hover { border-color:var(--gold-dim); transform:translateY(-1px); box-shadow:var(--shadow); }
.card-name { font-size:14px; font-weight:600; color:var(--white); margin-bottom:6px; }
.card-region { font-size:11px; color:var(--text-dim); margin-bottom:8px; }
.card-metrics { display:grid; grid-template-columns:1fr 1fr; gap:4px; }
.card-metric { font-size:11px; }
.card-metric span { color:var(--text-dim); }
.card-metric strong { color:var(--text); font-family:'JetBrains Mono',monospace; }
.card-blocker { margin-top:8px; padding:6px 8px; background:var(--red-bg); border-radius:4px; font-size:11px; color:var(--red); }
.card-warning { margin-top:8px; padding:6px 8px; background:var(--amber-bg); border-radius:4px; font-size:11px; color:var(--amber); }
.card-stale { border-left:3px solid var(--amber); }

/* ── PROJECT DETAIL MODAL ── */
.modal-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.7); z-index:200; justify-content:center; align-items:flex-start; padding:40px; overflow-y:auto; }
.modal-overlay.open { display:flex; }
.modal { background:var(--navy); border:1px solid rgba(200,169,81,0.15); border-radius:14px; width:100%; max-width:900px; box-shadow:0 20px 60px rgba(0,0,0,0.5); }
.modal-header { display:flex; align-items:center; justify-content:space-between; padding:20px 28px; border-bottom:1px solid rgba(200,169,81,0.1); }
.modal-header h2 { font-size:20px; color:var(--white); }
.modal-close { width:32px; height:32px; border-radius:6px; border:none; background:var(--navy-light); color:var(--text-dim); font-size:18px; cursor:pointer; display:flex; align-items:center; justify-content:center; }
.modal-close:hover { color:var(--gold); }
.modal-body { padding:24px 28px; }

.detail-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:24px; }
.detail-stat { background:var(--navy-light); border-radius:8px; padding:12px; }
.detail-stat .stat-label { font-size:10px; }
.detail-stat .stat-value { font-size:18px; }

.detail-section { margin-bottom:24px; }
.detail-section h3 { font-size:13px; text-transform:uppercase; letter-spacing:1px; color:var(--gold); margin-bottom:12px; padding-bottom:6px; border-bottom:1px solid rgba(200,169,81,0.1); }

.timeline { display:flex; flex-direction:column; gap:8px; }
.timeline-item { display:flex; gap:12px; padding:8px 12px; background:var(--navy-light); border-radius:6px; font-size:13px; }
.timeline-date { color:var(--text-dim); font-family:'JetBrains Mono',monospace; font-size:11px; min-width:80px; padding-top:2px; }
.timeline-type { display:inline-block; padding:1px 6px; border-radius:3px; font-size:10px; font-weight:600; text-transform:uppercase; margin-right:6px; }
.timeline-type.model { background:rgba(96,165,250,0.15); color:var(--blue); }
.timeline-type.email { background:var(--green-bg); color:var(--green); }
.timeline-type.note { background:var(--gold-bg); color:var(--gold); }
.timeline-type.milestone { background:rgba(168,85,247,0.15); color:#A855F7; }
.timeline-content { flex:1; }

.notes-box { background:var(--navy-light); border-radius:8px; padding:14px; font-size:13px; line-height:1.6; color:var(--text); }

/* ── UPLOAD DROP ZONE ── */
.upload-zone { border:2px dashed rgba(200,169,81,0.25); border-radius:var(--radius); padding:32px; text-align:center; margin:20px 32px; cursor:pointer; transition:all 0.2s; display:none; }
.upload-zone.visible { display:block; }
.upload-zone:hover, .upload-zone.dragover { border-color:var(--gold); background:var(--gold-bg); }
.upload-zone h3 { color:var(--gold); margin-bottom:6px; font-size:15px; }
.upload-zone p { color:var(--text-dim); font-size:13px; }
.upload-zone input { display:none; }

/* ── RESPONSIVE ── */
@media (max-width:1200px) { .summary { grid-template-columns:repeat(3,1fr); } }
@media (max-width:768px) {
  .summary { grid-template-columns:repeat(2,1fr); }
  .nav { padding:12px 16px; }
  .controls, .table-wrap, .kanban { padding-left:16px; padding-right:16px; }
  .kanban { flex-direction:column; }
  .kanban-col { min-width:auto; }
}

/* ── ANIMATIONS ── */
@keyframes fadeIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:none; } }
.fade-in { animation: fadeIn 0.3s ease forwards; }
</style>
</head>
<body>

<!-- NAV -->
<nav class="nav">
  <div class="nav-brand">

<!-- KANBAN VIEW -->
<div class="kanban" id="kanbanView" style="display:none;"></div>

<!-- PROJECT DETAIL MODAL -->
<div class="modal-overlay" id="modalOverlay" onclick="if(event.target===this)closeModal()">
  <div class="modal fade-in" id="modalContent"></div>
</div>

];

let currentView = 'table';
let searchFilter = '';

// ═══════════════════════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════════════════════
document.addEventListener('DOMContentLoaded', () => {
  loadFromAPI();
  render();
});

async function loadFromAPI() {
  try {
    const res = await fetch(API);
    if (res.ok) {
      const data = await res.json();
      if (data.length > 0) PROJECTS = data;
    }
  } catch(e) { /* API not yet deployed, use seed data */ }
  render();
}

// ═══════════════════════════════════════════════════════════════
// RENDER
// ═══════════════════════════════════════════════════════════════
function render() {
  renderSummary();
  renderTable();
  renderKanban();
}

function filtered() {
  if (!searchFilter) return PROJECTS;
  const q = searchFilter.toLowerCase();
  return PROJECTS.filter(p =>
    p.name.toLowerCase().includes(q) ||
    p.region.toLowerCase().includes(q) ||
    (p.counterparties||'').toLowerCase().includes(q) ||
    (p.blocker||'').toLowerCase().includes(q)
  );
}

function renderSummary() {
  const ps = PROJECTS;
  const totalHa = ps.reduce((s,p) => s + (p.hectares||0), 0);
  const totalCredits = ps.reduce((s,p) => s + (p.estimated_credits||0), 0);
  const totalCapex = ps.reduce((s,p) => s + (p.capex_12mo||0), 0);
  const totalRev = ps.reduce((s,p) => s + (p.revenue_12mo||0), 0);
  const totalPnl = ps.reduce((s,p) => s + (p.pnl_12mo||0), 0);
  const activeCount = ps.filter(p => !['registered','paused'].includes(p.status)).length;

  document.getElementById('summaryBar').innerHTML = `
    <div class="stat"><div class="stat-label">Projects</div><div class="stat-value gold">${activeCount}</div><div class="stat-sub">${ps.length} total</div></div>
    <div class="stat"><div class="stat-label">Hectares</div><div class="stat-value">${fmt(totalHa,0)}</div></div>
    <div class="stat"><div class="stat-label">Lifetime Credits</div><div class="stat-value">${fmtK(totalCredits)}</div></div>
    <div class="stat"><div class="stat-label">Pipeline Capex</div><div class="stat-value">€${fmtK(totalCapex)}</div></div>
    <div class="stat"><div class="stat-label">Pipeline Revenue</div><div class="stat-value">€${fmtK(totalRev)}</div></div>
    <div class="stat"><div class="stat-label">Pipeline PNL</div><div class="stat-value ${totalPnl>=0?'positive':'negative'}">€${fmtK(totalPnl)}</div></div>
  `;
}

function renderTable() {
  const ps = filtered();
  // Total row
  const totals = {
    hectares: ps.reduce((s,p) => s+(p.hectares||0),0),
    credits: ps.reduce((s,p) => s+(p.estimated_credits||0),0),
    capex: ps.reduce((s,p) => s+(p.capex_12mo||0),0),
    rev: ps.reduce((s,p) => s+(p.revenue_12mo||0),0),
    pnl: ps.reduce((s,p) => s+(p.pnl_12mo||0),0),
  };

  let html = `<tr class="total-row">
    <td>📊 TOTAL (${ps.length} projects)</td><td></td><td></td><td></td>
    <td class="cell-right mono">${fmt(totals.hectares,1)}</td>
    <td class="cell-right mono">${fmtN(totals.credits)}</td>
    <td class="cell-right mono">€${fmtN(totals.capex)}</td>
    <td class="cell-right mono">€${fmtN(totals.rev)}</td>
    <td class="cell-right mono ${totals.pnl>=0?'positive':'negative'}">€${fmtN(totals.pnl)}</td>
    <td></td><td></td><td></td><td></td><td></td>
  </tr>`;

  ps.forEach(p => {
    const warn = p.npv && p.npv < 0;
    html += `<tr onclick="openProject('${p.id}')" ${warn?'style="border-left:3px solid var(--red)"':''}>
      <td><strong>${p.name}</strong></td>
      <td>${p.region}</td>
      <td style="font-size:11px">${p.land_type}</td>
      <td><span class="badge badge-${p.status}">${STATUS_LABELS[p.status]||p.status}</span></td>
      <td class="cell-right mono">${p.hectares?fmt(p.hectares,1):'—'}</td>
      <td class="cell-right mono">${p.estimated_credits?fmtN(p.estimated_credits):'—'}</td>
      <td class="cell-right mono">${p.capex_12mo?'€'+fmtN(p.capex_12mo):'—'}</td>
      <td class="cell-right mono">${p.revenue_12mo?'€'+fmtN(p.revenue_12mo):'—'}</td>
      <td class="cell-right mono ${(p.pnl_12mo||0)<0?'negative':''}">${p.pnl_12mo!=null?'€'+fmtN(p.pnl_12mo):'—'}</td>
      <td class="cell-right mono">${p.moic?fmt(p.moic,2)+'x':'—'}</td>
      <td class="cell-right mono">${p.irr!=null?fmt(p.irr,1)+'%':'—'}</td>
      <td class="cell-right mono ${p.npv&&p.npv<0?'negative':''}">${p.npv!=null?'€'+fmtN(p.npv):'—'}</td>
      <td style="max-width:200px;white-space:normal;font-size:12px;color:${warn?'var(--red)':'var(--text-dim)'}">${p.blocker||''}</td>
      <td class="mono" style="font-size:11px;color:var(--text-dim)">${p.last_update||''}</td>
    </tr>`;
  });
  document.getElementById('tableBody').innerHTML = html;
}

function renderKanban() {
  const ps = filtered();
  const cols = STATUSES.filter(s => ps.some(p => p.status === s));
  let html = '';
  cols.forEach(status => {
    const items = ps.filter(p => p.status === status);
    html += `<div class="kanban-col">
      <div class="kanban-header">
        <h3>${STATUS_LABELS[status]||status}</h3>
        <span class="kanban-count">${items.length}</span>
      </div>
      <div class="kanban-cards">
        ${items.map(p => {
          const stale = daysSince(p.last_update) > 14;
          return `<div class="card ${stale?'card-stale':''}" onclick="openProject('${p.id}')">
            <div class="card-name">${p.name}</div>
            <div class="card-region">${p.region} · ${p.land_type}</div>
            <div class="card-metrics">
              <div class="card-metric"><span>Ha</span> <strong>${p.hectares?fmt(p.hectares,0):'—'}</strong></div>
              <div class="card-metric"><span>Credits</span> <strong>${p.estimated_credits?fmtK(p.estimated_credits):'—'}</strong></div>
              <div class="card-metric"><span>Rev</span> <strong>${p.revenue_12mo?'€'+fmtK(p.revenue_12mo):'—'}</strong></div>
              <div class="card-metric"><span>PNL</span> <strong>${p.pnl_12mo!=null?'€'+fmtK(p.pnl_12mo):'—'}</strong></div>
            </div>
            ${p.blocker?`<div class="${p.npv&&p.npv<0?'card-blocker':'card-warning'}">${p.blocker}</div>`:''}
            ${stale?`<div class="card-warning">⚠ No update in ${daysSince(p.last_update)} days</div>`:''}
          </div>`;
        }).join('')}
      </div>
    </div>`;
  });
  document.getElementById('kanbanView').innerHTML = html;
}

      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body">

        <div class="detail-stat"><div class="stat-label">Lifetime Credits</div><div class="stat-value">${p.estimated_credits?fmtN(p.estimated_credits):'—'}</div><div class="stat-sub">${p.project_life?p.project_life+'yr life':''} ${p.credit_price?'@ €'+p.credit_price:''}</div></div>

        <div class="detail-stat"><div class="stat-label">PNL</div><div class="stat-value ${(p.pnl_12mo||0)<0?'negative':'positive'}">€${p.pnl_12mo!=null?fmtN(p.pnl_12mo):'—'}</div><div class="stat-sub">${p.moic?'MOIC '+fmt(p.moic,2)+'x':''} ${p.irr!=null?'| IRR '+fmt(p.irr,1)+'%':''}</div></div>

      ${p.npv!=null?`<div class="detail-grid" style="grid-template-columns:repeat(3,1fr)">

      </div>

        <div class="notes-box">${p.notes||'—'}</div>
      </div>

      <div class="detail-section">
        <h3>Counterparties</h3>
        <div class="notes-box">${p.counterparties||'—'}</div>
      </div>

      <div class="detail-section">
        <h3>Timeline</h3>
        <div class="timeline" id="timeline-${p.id}">
          <div class="timeline-item">
            <div class="timeline-date">${p.last_update}</div>
            <div class="timeline-content"><span class="timeline-type model">model</span> Data updated from ${p.model_source}</div>
          </div>

      </div>

      <div style="display:flex;gap:10px;margin-top:16px">
        <span style="font-size:11px;color:var(--text-dim)">Owner: ${p.owner||'—'} · Buyer: ${p.buyer||'—'} · Land: ${p.land_type} · Region: ${p.region}</span>
      </div>
    </div>
  `;
  document.getElementById('modalOverlay').classList.add('open');
  loadHubSpotActivity(p);
}

// UPLOAD HANDLER
// ═══════════════════════════════════════════════════════════════
function toggleUpload() {
  document.getElementById('uploadZone').classList.toggle('visible');
}

function handleDrop(e) {
  e.preventDefault();
  e.target.closest('.upload-zone').classList.remove('dragover');
  const file = e.dataTransfer.files[0];
  if (file) uploadFile(file);
}

function handleFileSelect(e) {
  const file = e.target.files[0];
  if (file) uploadFile(file);
}

async function uploadFile(file) {
  if (!file.name.endsWith('.xlsx')) { alert('Please upload an .xlsx file'); return; }

  // Try API upload first
  try {
    const formData = new FormData();
    formData.append('file', file);
    const res = await fetch(`${API}/ingest`, { method:'POST', body:formData });
    if (res.ok) {
      const data = await res.json();
      alert(`✅ ${data.project_name} updated: ${data.hectares} ha, ${data.credits} credits`);
      await loadFromAPI();
      render();
      return;
    }
  } catch(e) { /* API not deployed yet, parse client-side */ }

  // Client-side fallback: parse xlsx with SheetJS
  alert('API not yet deployed. Upload will work once worker v13 is live.\n\nFile: ' + file.name);
}

// ═══════════════════════════════════════════════════════════════
// UTILS
// ═══════════════════════════════════════════════════════════════
function fmt(n,d) { return n!=null ? Number(n).toFixed(d) : '—'; }
function fmtN(n) { return n!=null ? Number(n).toLocaleString('en-US',{maximumFractionDigits:0}) : '—'; }
function fmtK(n) {
  if (n==null) return '—';
  const abs = Math.abs(n);
  if (abs >= 1e6) return (n/1e6).toFixed(1)+'M';
  if (abs >= 1e3) return (n/1e3).toFixed(0)+'k';
  return fmtN(n);
}
function daysSince(dateStr) {
  if (!dateStr) return 999;
  return Math.floor((Date.now() - new Date(dateStr).getTime()) / 86400000);
}
