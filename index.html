<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ClearSky</title>
  <link rel="icon" type="image/png" href="./assets/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;600;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --navy: #0D1B3E;
      --steel: #5B9BD5;
      --gold: #D4A843;
      --midnight: #1B2A4A;
      --frost: #F5F7FA;
      --slate: #8A8F9A;
      --emerald: #1A8A6E;
      --hero-dark: #0a1628;
      --hero-teal: #0d3b4f;
      --white: #FFFFFF;
      --section-pad: 120px;
      --section-pad-mob: 64px;
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'Roboto', Arial, sans-serif;
      color: var(--navy);
      background: var(--white);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    p { max-width: 680px; }
    a { color: inherit; text-decoration: none; }

    .container { max-width: 1200px; margin: 0 auto; padding: 0 40px; }

    /* ===== NAV ===== */
    .nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
      padding: 20px 0;
      transition: background 0.4s, padding 0.3s, box-shadow 0.3s;
    }
    .nav.scrolled {
      background: rgba(13,27,62,0.97);
      padding: 12px 0;
      box-shadow: 0 2px 20px rgba(0,0,0,0.15);
      backdrop-filter: blur(12px);
    }
    .nav .container { display: flex; align-items: center; justify-content: space-between; }
    .nav-logo img { height: 36px; width: auto; }
    .nav-links { display: flex; align-items: center; gap: 36px; list-style: none; }
    .nav-links a {
      color: var(--white); font-size: 0.82rem; font-weight: 400;
      letter-spacing: 0.06em; text-transform: uppercase; opacity: 0.8;
      transition: opacity 0.2s;
    }
    .nav-links a:hover { opacity: 1; }
    .nav-cta {
      background: #c9a84c !important;
      color: #0a1628 !important;
      border: none;
      padding: 8px 24px; border-radius: 2px; opacity: 1 !important;
      transition: background 0.2s;
    }
    .nav-cta:hover { background: #d4b55c !important; }

    .nav-toggle { display: none; background: none; border: none; cursor: pointer; padding: 4px; }
    .nav-toggle span { display: block; width: 24px; height: 2px; background: var(--white); margin: 5px 0; transition: transform 0.3s, opacity 0.3s; }
    .nav-toggle.active span:nth-child(1) { transform: rotate(45deg) translate(5px,5px); }
    .nav-toggle.active span:nth-child(2) { opacity: 0; }
    .nav-toggle.active span:nth-child(3) { transform: rotate(-45deg) translate(5px,-5px); }

    /* ===== HERO — DARK ===== */
    .hero {
      position: relative; min-height: 100vh;
      display: flex; align-items: center; justify-content: center; text-align: center;
      overflow: hidden;
    }
    .hero-bg {
      position: absolute; inset: -5%; z-index: 0; width: 110%; height: 110%;
      background: url('./assets/backgrounds/mountain-alpine-lakes.jpg') center/cover no-repeat;
      animation: heroZoom 20s ease-in-out infinite alternate;
    }
    @keyframes heroZoom {
      from { transform: scale(1); }
      to { transform: scale(1.05); }
    }
    .hero-overlay {
      position: absolute; inset: 0; z-index: 1;
      background: rgba(10,22,40,0.65);
    }
    .hero-gradient {
      position: absolute; inset: 0; z-index: 2;
      background: linear-gradient(135deg,
        rgba(10,22,40,0.5) 0%, rgba(13,59,79,0.3) 25%,
        rgba(10,22,40,0.4) 50%, rgba(11,45,61,0.3) 75%,
        rgba(10,22,40,0.5) 100%);
      background-size: 400% 400%;
      animation: heroShift 18s ease infinite;
    }
    @keyframes heroShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    .hero-content { position: relative; z-index: 3; padding: 0 40px; max-width: 900px; }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ===== ABOUT — LIGHT ===== */
    .about { padding: var(--section-pad) 0; background: var(--white); }
    .about .container { text-align: center; }

    .section-label {
      font-size: 0.75rem; font-weight: 500; letter-spacing: 0.2em;
      text-transform: uppercase; color: var(--gold); margin-bottom: 16px;
    }
    .section-title {
      font-size: clamp(2rem,3vw,2.8rem); font-weight: 700;
      color: var(--navy); margin-bottom: 32px; line-height: 1.15;
    }
    .section-title--light { color: var(--white); }

    /* ===== TEAM — LIGHT (text only, law firm style) ===== */
    .team { padding: var(--section-pad) 0; background: var(--frost); }
    .team .container { text-align: center; }
    .team-grid {
      display: grid; grid-template-columns: repeat(2,1fr); gap: 0;
      margin-top: 56px; max-width: 960px; margin-left: auto; margin-right: auto;
      text-align: left;
    }
    .team-member {
      padding: 32px 36px;
      border-bottom: 1px solid rgba(13,27,62,0.08);
      display: flex; flex-direction: column;
    }
    .team-member:nth-child(odd) { border-right: 1px solid rgba(13,27,62,0.08); }
    .team-header { display: flex; align-items: baseline; gap: 12px; margin-bottom: 6px; flex-wrap: wrap; }
    .team-member h3 { font-size: 1.05rem; font-weight: 600; color: var(--navy); }
    .team-member .team-title {
      font-size: 0.78rem; font-weight: 500; color: var(--gold); letter-spacing: 0.03em;
    }

    /* ===== CTA — DARK (photo background) ===== */
    .cta {
      position: relative; padding: var(--section-pad) 0;
      text-align: center; overflow: hidden;
    }
    .cta-bg {
      position: absolute; inset: 0; z-index: 0;
      background: url('./assets/backgrounds/mountain-alpine-lakes.jpg') center/cover no-repeat;
    }
    .cta-overlay {
      position: absolute; inset: 0; z-index: 1;
      background: rgba(10,22,40,0.78);
    }
    .cta .container { position: relative; z-index: 2; }
    .cta .section-title { color: var(--white); margin-bottom: 20px; }

    /* ===== FOOTER — DARK ===== */
    .footer {
      background: var(--hero-dark); padding: 48px 0 36px;
      position: relative; overflow: hidden;
    }
    .footer-watermark {
      position: absolute; bottom: -10px; right: 40px;
      font-size: 6rem; font-weight: 700; color: rgba(255,255,255,0.015);
      pointer-events: none; user-select: none; line-height: 1;
    }
    .footer .container {
      display: flex; align-items: center; justify-content: space-between;
      position: relative; z-index: 1;
    }
    .footer-left { display: flex; align-items: center; gap: 20px; }
    .footer-logo img { height: 28px; width: auto; opacity: 0.9; }
    .footer-right { font-size: 0.72rem; color: rgba(255,255,255,0.35); }

    /* ===== SCROLL REVEAL ===== */
    .reveal {
      opacity: 0; transform: translateY(24px);
      transition: opacity 0.7s ease, transform 0.7s ease;
    }
    .reveal.visible { opacity: 1; transform: translateY(0); }
    .reveal-d1 { transition-delay: 0.1s; }
    .reveal-d2 { transition-delay: 0.2s; }
    .reveal-d3 { transition-delay: 0.3s; }
    .reveal-d4 { transition-delay: 0.4s; }

    /* ===== CONTACT FORM ===== */
    .contact-form { max-width: 520px; margin: 0 auto; text-align: left; }
    .form-group { margin-bottom: 20px; }
    .form-group label {
      display: block; font-size: 0.82rem; font-weight: 500;
      color: rgba(255,255,255,0.9); margin-bottom: 8px;
      letter-spacing: 0.04em; text-transform: uppercase;
    }
    .form-group input,
    .form-group select,
    .form-group textarea {
      width: 100%; padding: 12px 16px;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.25);
      border-radius: 2px; color: var(--white);
      font-family: 'Roboto', sans-serif; font-size: 0.95rem;
      transition: border-color 0.3s, background 0.3s;
    }
    .form-group select option {
      background: var(--navy); color: var(--white);
    }
    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus {
      outline: none; border-color: var(--gold);
      background: rgba(255,255,255,0.15);
    }
    .form-group textarea { resize: vertical; min-height: 120px; }
    .form-submit {
      display: block; width: 100%; padding: 14px;
      background: var(--gold); color: var(--hero-dark);
      font-size: 0.85rem; font-weight: 600; letter-spacing: 0.1em;
      text-transform: uppercase; border: none; border-radius: 2px;
      cursor: pointer; transition: background 0.3s;
    }
    .form-submit:hover { background: #c49a38; }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 768px) {
      :root { --section-pad: var(--section-pad-mob); }
      .container { padding: 0 24px; }
      .nav-links { display: none; }
      .nav-toggle { display: block; }
      .nav-links.open {
        display: flex; flex-direction: column; position: fixed;
        top: 0; left: 0; right: 0; bottom: 0;
        background: rgba(10,22,40,0.98); justify-content: center;
        align-items: center; gap: 28px; z-index: 999;
      }
      .nav-links.open a { font-size: 1.1rem; opacity: 1; }
      .hero h1 { font-size: clamp(2rem,7vw,3rem); }
      .team-grid { grid-template-columns: 1fr; }
      .team-member { border-right: none !important; }
      .footer .container { flex-direction: column; gap: 16px; text-align: center; }
      .footer-left { justify-content: center; }
      .footer .container > div:last-child { align-items: center !important; }
    }
  </style>
</head>
<body>

  <!-- NAV -->
  <nav class="nav" id="nav">
    <div class="container">
      <a href="#" class="nav-logo"><img src="./assets/logos/logo-white.png" alt="ClearSky"></a>
      <ul class="nav-links" id="navLinks">
        <li><a href="#about">About</a></li>
        <li><a href="#team">Team</a></li>
        <li><a href="#contact" class="nav-cta">Contact</a></li>
      </ul>
      <button class="nav-toggle" id="navToggle" aria-label="Menu">
        <span></span><span></span><span></span>
      </button>
    </div>
  </nav>

  <!-- HERO — DARK -->
  <section class="hero" id="hero">
    <div class="hero-bg"></div>
    <div class="hero-overlay"></div>
    <div class="hero-gradient"></div>
    <div class="hero-content">
    </div>
  </section>

  <!-- ABOUT — LIGHT -->
  <section class="about" id="about">
    <div class="container">
    </div>
  </section>

  <!-- TEAM — LIGHT (text only, law firm style) -->
  <section class="team" id="team">
    <div class="container">
      <div class="section-label reveal">Our People</div>
      <h2 class="section-title reveal">The Team</h2>
      <div class="team-grid">

        <div class="team-member reveal reveal-d1">
          <div class="team-header">
            <h3>Brian Katz</h3>
            <span class="team-title">Co-Founder &amp; CEO</span>
          </div>
        </div>

        <div class="team-member reveal reveal-d2">
          <div class="team-header">
            <h3>Luis Felipe Adaime</h3>
            <span class="team-title">Head of Business Development, Spain Lead</span>
          </div>
        </div>

        <div class="team-member reveal reveal-d3">
          <div class="team-header">
            <h3>Carolina Martinez</h3>
            <span class="team-title">Sales &amp; Trading Associate</span>
          </div>
        </div>

        <div class="team-member reveal reveal-d4">
          <div class="team-header">
            <h3>Emmanuel Silva</h3>
            <span class="team-title">Carbon Project &amp; Operations Analyst</span>
          </div>
        </div>

      </div>
    </div>
  </section>

  <!-- CONTACT — DARK (photo background) -->
  <section class="cta" id="contact">
    <div class="cta-bg"></div>
    <div class="cta-overlay"></div>
    <div class="container">
      <h2 class="section-title section-title--light reveal">Get in Touch</h2>
      <form class="contact-form reveal" action="https://formspree.io/f/xwpkzapj" method="POST">
        <div class="form-group">
          <label for="name">Name</label>
          <input type="text" id="name" name="name" required>
        </div>
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required>
        </div>
        <div class="form-group">
          <label for="role">I am a...</label>
          <select id="role" name="role" required>
            <option value="">Select one...</option>
            <option value="Project Developer">Project Developer</option>
            <option value="Capital Provider / Investor">Capital Provider / Investor</option>
            <option value="Other">Other</option>
          </select>
        </div>
        <div class="form-group">
          <label for="company">Company</label>
          <input type="text" id="company" name="company">
        </div>
        <div class="form-group">
          <label for="message">Message</label>
          <textarea id="message" name="message" required></textarea>
        </div>
        <button type="submit" class="form-submit">Send Message</button>
      </form>
    </div>
  </section>

  <!-- FOOTER — DARK -->
  <footer class="footer">
    <div class="footer-watermark">//</div>
    <div class="container">
      <div class="footer-left">
        <a href="#" class="footer-logo"><img src="./assets/logos/logo-white.png" alt="ClearSky"></a>
      </div>
      <div style="display:flex;flex-direction:column;align-items:flex-end;gap:6px;">
        <div class="footer-right">&copy; <span id="yr"></span> ClearSky Limited. All rights reserved.</div>
      </div>
    </div>
  </footer>

  <script>
    document.getElementById('yr').textContent = new Date().getFullYear();
    const nav = document.getElementById('nav');
    const hero = document.getElementById('hero');
    new IntersectionObserver(([e]) => nav.classList.toggle('scrolled', !e.isIntersecting), {threshold:.1}).observe(hero);
    const toggle = document.getElementById('navToggle');
    const links = document.getElementById('navLinks');
    toggle.addEventListener('click', () => { toggle.classList.toggle('active'); links.classList.toggle('open'); });
    links.querySelectorAll('a').forEach(a => a.addEventListener('click', () => { toggle.classList.remove('active'); links.classList.remove('open'); }));
    const ro = new IntersectionObserver(es => es.forEach(e => { if(e.isIntersecting) e.target.classList.add('visible'); }), {threshold:.1, rootMargin:'0px 0px -40px 0px'});
    document.querySelectorAll('.reveal').forEach(el => ro.observe(el));
  </script>

</body>
</html>
